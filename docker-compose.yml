version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: craftverse-postgres
    restart: always
    environment:
      POSTGRES_USER: craftverse
      POSTGRES_PASSWORD: craftverse_secure_password
      POSTGRES_DB: craftverse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U craftverse -d craftverse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
